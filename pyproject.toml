[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
# The system prompt is natural-language text: one long line per rule.
per-file-ignores = { "helpdesk/prompts.py" = ["E501"] }
